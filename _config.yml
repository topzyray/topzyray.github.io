# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Site

lang: en
timezone: Africa/Lagos

title: "Tope Taiwo"

tagline: "Fullstack Software Engineer"

description: >-
  Tope Taiwo is a fullstack software engineer with 4+ years of experience building production-grade web, mobile, and cloud-native applications with TypeScript, Python, React, React Native, Next.js, NestJS, FastAPI, PostgreSQL, MongoDB, and Redis.

# description: >-
#   Tope Taiwo is a fullstack software engineer with 4+ years of experience building production-grade web, mobile, and cloud-native applications with TypeScript, Python, React, React Native, Next.js, NestJS, FastAPI, PostgreSQL, MongoDB, and Redis.

url: "https://topzyray.github.io"

baseurl: ""

# GitHub

github:
  username: topzyray

# Twitter / X

twitter:
  username: taiwotopesunday

# Social

social:
  name: "Tope Taiwo"
  email: "taiwo.tope@proton.me"
  fediverse_handle:

  links:
    - "https://twitter.com/taiwotopesunday"
    - "https://github.com/topzyray"
    - "https://www.linkedin.com/in/taiwotopesunday"

# Site Verification

webmaster_verifications:
  google: "cF-zkCdwAtNBNlvuvyYRpY05xW9D-66-s8RsNR8UtkU"
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Analytics

analytics:
  google:
    id:

  goatcounter:
    id: topzyray

  umami:
    id:
    domain:

  matomo:
    id:
    domain:

  cloudflare:
    id:

  fathom:
    id:

# Page Views

pageviews:
  provider: goatcounter

# Theme

theme_mode:

# Media

cdn:

avatar: "/assets/img/avatar.jpeg"

social_preview_image: "/assets/img/social_preview.png"

# Table of Contents

toc: true

# Actions

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments

comments:
  provider: dual

  disqus:
    shortname: "topzyray"

  utterances:
    repo: topzyray/topzyray.github.io
    issue_term: pathname

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted Assets

assets:
  self_host:
    enabled:
    env:

# PWA

pwa:
  enabled: true

  cache:
    enabled: true

    deny_paths:
      # - "/example"

# Pagination

paginate: 10

# The following options are not recommended to be modified

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"

  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1

# Collections

collections:
  tabs:
    output: true
    sort_by: order

# Defaults

defaults:
  - scope:
      path: ""
      type: posts

    values:
      layout: post
      comments: true
      toc: true

      # Do not change this permalink unless you are prepared
      # to update existing post links.
      permalink: /posts/:title/

  - scope:
      path: _drafts

    values:
      comments: false

  - scope:
      path: ""
      type: tabs

    values:
      layout: page
      permalink: /:title/

# Sass

sass:
  style: compressed

# HTML Compression

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs:
      - development

# Jekyll Archives

jekyll-archives:
  enabled:
    - categories
    - tags

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Exclude

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
